  .slide img { display:block; width:100%; height:100%; }

             transition:box-shadow .15s, transform .15s; }

  .lista h2 { font-size:15px; letter-spacing:.2em; color:var(--red); margin:0 0 12px; }
  .uf { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--lb);
        border-radius:999px; padding:8px 8px 8px 18px; margin-bottom:10px; }
  .uf strong { flex:1; font-size:16px; } .uf strong span { color:var(--red); margin-right:6px; }
  .uf a { text-decoration:none; font-weight:700; font-size:14px; padding:9px 16px; border-radius:999px; }
  .iss { color:var(--navy); border:1.5px solid var(--navy); background:#fff; }
  .icms { color:#fff; background:var(--red); border:1.5px solid var(--red); }
  .podcast { display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;
             margin:24px auto 0; max-width:720px; padding:14px 26px; background:#fff;
             border:1px solid var(--lb); border-radius:999px; text-decoration:none; color:var(--navy);
             font-size:17px; transition:box-shadow .15s, transform .15s; }
  .podcast:hover { box-shadow:0 6px 22px rgba(1,29,48,.12); transform:translateY(-1px); }

  @media (max-width:760px) { .podcast { border-radius:18px; text-align:center; font-size:15px; } }
  footer { text-align:center; color:var(--mut); font-size:13px; margin:22px 0 8px; }
